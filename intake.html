<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="titleIntake">عيادات مسجد الجامع - استقبال المرضى</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="app-wrapper">
        <aside class="app-sidebar" id="appSidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="brand-logo">
                    <div class="brand-logo-icon"><i class="fa-solid fa-hospital-user"></i></div>
                    <span data-i18n="brandName">عيادات مسجد الجامع</span>
                </a>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item doctor-hide">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span data-i18n="navDashboard">الرئيسية - طلبات الحجز</span>
                    <span class="nav-badge" id="sidebarAppointmentsBadge">0</span>
                </a>
                <a href="intake.html" class="nav-item active">
                    <i class="fa-solid fa-user-plus"></i>
                    <span data-i18n="navIntake">استقبال المرضى</span>
                </a>
                <a href="prescription.html" class="nav-item">
                    <i class="fa-solid fa-prescription"></i>
                    <span data-i18n="navPrescription">كتابة الروشتة</span>
                </a>
                <a href="patients.html" class="nav-item">
                    <i class="fa-solid fa-user-injured"></i>
                    <span data-i18n="navPatients">بيانات المرضى</span>
                </a>
                <div class="nav-section-title" data-i18n="sectionData">البيانات والأقسام</div>
                <a href="staff-doctors.html" class="nav-item">
                    <i class="fa-solid fa-user-doctor"></i>
                    <span data-i18n="navStaffDoctors">الأطباء والعاملين</span>
                </a>
                <a href="categories.html" class="nav-item">
                    <i class="fa-solid fa-tags"></i>
                    <span data-i18n="navCategories">أقسام العيادات</span>
                </a>
                <a href="clinic-branches.html" class="nav-item">
                    <i class="fa-solid fa-building"></i>
                    <span data-i18n="navClinicBranches">فروع العيادات</span>
                </a>
                <div class="nav-section-title admin-only-nav" data-i18n="sectionAdmin" style="display:none">الإدارة</div>
                <a href="users.html" class="nav-item admin-only-nav" style="display:none">
                    <i class="fa-solid fa-users-gear"></i>
                    <span data-i18n="navUserManagement">إدارة المستخدمين</span>
                </a>
                <div class="nav-section-title reports-nav" data-i18n="sectionReports" style="display:none">التقارير</div>
                <a href="reports.html" class="nav-item reports-nav" style="display:none">
                    <i class="fa-solid fa-chart-line"></i>
                    <span data-i18n="navReports">التقارير</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-mini-card">
                    <div class="user-avatar" id="sidebarUserAvatar">A</div>
                    <div class="user-info">
                        <div class="user-name" id="sidebarUserName">...</div>
                        <div class="user-role-badge" id="sidebarUserRole">...</div>
                    </div>
                    <button class="btn-logout" onclick="auth.signOut()" title="تسجيل الخروج" data-i18n-title="tooltipLogout">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </aside>

        <div class="app-main">
            <header class="app-topbar">
                <div class="topbar-left">
                    <button class="btn-hamburger" id="btnHamburger"><i class="fa-solid fa-bars"></i></button>
                    <h1 class="topbar-title" data-i18n="navIntake">استقبال المرضى</h1>
                </div>
                <div class="topbar-right">
                    <div class="branch-indicator-badge" id="topbarBranchIndicator">
                        <i class="fa-solid fa-hospital"></i> <span data-i18n="allBranches">جميع الفروع</span>
                    </div>
                    <button class="btn-icon" id="themeToggleBtn" onclick="toggleDashboardTheme()" title="الوضع الليلي" data-i18n-title="tooltipTheme"><i class="fa-solid fa-moon"></i></button>
                    <button class="btn-icon" onclick="notifications.clearUnread()" title="الإشعارات" data-i18n-title="tooltipNotifications"><i class="fa-solid fa-bell"></i><span class="notification-badge-dot" id="topbarNotificationDot"></span></button>
                    <button id="langSwitcherBtn" class="lang-switcher-btn" onclick="i18n.toggleLanguage()"><i class="fa-solid fa-globe"></i> <span>English</span></button>
                </div>
            </header>

            <main class="page-content">
                <div class="content-card">
                    <div class="card-header">
                        <div class="card-title">
                            <i class="fa-solid fa-user-plus" style="color: var(--primary);"></i>
                            <span data-i18n="intakeTitle">استقبال مريض جديد</span>
                        </div>
                        <a href="patients.html" class="btn btn-outline btn-sm">
                            <i class="fa-solid fa-user-injured"></i> <span data-i18n="navPatients">بيانات المرضى</span>
                        </a>
                    </div>
                    <div class="card-body">
                        <form id="intakeForm" onsubmit="handleIntakeSubmit(event)">
                            <div class="form-grid">
                                <div class="form-group" style="position:relative;">
                                    <label class="form-label" data-i18n="patientName">اسم المريض *</label>
                                    <input type="text" id="intakeName" class="form-control" required autocomplete="off">
                                    <div id="intakePatientSuggestions" class="patient-suggestions"></div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" data-i18n="patientGender">الجنس *</label>
                                    <select id="intakeGender" class="form-control">
                                        <option value="male" data-i18n="genderMale">ذكر</option>
                                        <option value="female" data-i18n="genderFemale">أنثى</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" data-i18n="patientAge">العمر</label>
                                    <input type="number" id="intakeAge" class="form-control" min="0" max="130">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" data-i18n="patientPhone">رقم الهاتف</label>
                                    <input type="tel" id="intakePhone" class="form-control" placeholder="01012345678">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" data-i18n="patientWeight">الوزن (كجم)</label>
                                    <input type="number" id="intakeWeight" class="form-control" min="0" max="500" step="0.1">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" data-i18n="visitType">نوع الكشف *</label>
                                    <select id="intakeVisitType" class="form-control">
                                        <option value="new" data-i18n="visitNew">كشف جديد</option>
                                        <option value="followup" data-i18n="visitFollowup">إعادة كشف</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" data-i18n="assignedDoctor">الطبيب المسؤول</label>
                                    <select id="intakeDoctor" class="form-control"><option value="">--</option></select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" data-i18n="visitDate">التاريخ</label>
                                    <input type="date" id="intakeDate" class="form-control">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" data-i18n="complaintDetails">تفاصيل الشكوى</label>
                                <textarea id="intakeDetails" class="form-control" rows="3"></textarea>
                            </div>

                            <div class="form-row" style="margin-bottom:1.25rem;">
                                <div class="multi-upload-wrap">
                                    <label class="upload-chip" for="intakeRxFile">
                                        <i class="fa-solid fa-images"></i>
                                        <span data-i18n="prescriptionImageUpload">إضافة صورة الروشتة (اختياري)</span>
                                    </label>
                                    <input type="file" id="intakeRxFile" accept="image/*" multiple style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;">
                                    <div class="uploaded-preview" id="rxPreview"></div>
                                </div>
                                <div class="multi-upload-wrap">
                                    <label class="upload-chip" for="intakeLabFile">
                                        <i class="fa-solid fa-flask"></i>
                                        <span data-i18n="labImageUpload">إضافة صورة التحاليل (اختياري)</span>
                                    </label>
                                    <input type="file" id="intakeLabFile" accept="image/*" multiple style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;">
                                    <div class="uploaded-preview" id="labPreview"></div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary" id="btnIntakeSubmit">
                                <i class="fa-solid fa-floppy-disk"></i> <span data-i18n="savePatient">حفظ بيانات المريض</span>
                            </button>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/intake.js"></script>
</body>
</html>
